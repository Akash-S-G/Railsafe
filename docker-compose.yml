services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: railsafe
      POSTGRES_USER: railsafe
      POSTGRES_PASSWORD: railsafe
    ports:
      - "5433:5432"  # host 5433 to avoid conflict with host postgres 5432 (see ps aux postgres 16/main)
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - ./datasets:/datasets:ro
volumes:
  pgdata:
